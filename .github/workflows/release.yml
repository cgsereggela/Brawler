# Builds Brawler for Windows, Linux and macOS and publishes the zips as a GitHub release.
#
#   Release:  git tag v0.2.0 && git push origin v0.2.0
#   Dry run:  Actions tab > Release > Run workflow (builds and uploads the zips as a workflow artifact, no release)
#
# The tag sets the game version (shown in the menu and checked when friends join), so everyone on the
# same release can play together.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  DOTNET_VERSION: 9.0.x

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Unit tests
        run: dotnet run -c Release --project tests

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-mono-${{ env.GODOT_VERSION }}

      - name: Download Godot .NET and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          curl -fsSL -o /tmp/godot.zip $base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz $base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono/

      - name: Package
        shell: pwsh
        run: |
          $godot = Get-ChildItem ~/godot -Recurse -Filter "Godot_v*_mono_linux.x86_64" | Select-Object -First 1
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME } else { $version = "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          ./tools/package.ps1 -Godot $godot.FullName -Version $version

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: brawler-builds
          path: dist/*.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Brawler $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES.md --generate-notes
